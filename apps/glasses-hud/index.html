<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="digiVoice HUD — glanceable transaction states for Meta Ray-Ban Display. The lens can propose; only the phone approves." />
    <meta name="mrbd-web-app-capable" content="yes" />
    <link rel="icon" href="data:," />
    <title>digiVoice — Glasses HUD</title>
    <style>
      /* Wearer POV — you are looking through the lens. Real renders from this
         app (public/hud/) project into the field of view, cycling all states.
         ?bare=1 renders the interactive app instead (test gate / captures). */
      #stage { position: fixed; inset: 0; overflow: hidden; background: #0a1322; }
      /* ambient world, soft and out of focus */
      #world { position: absolute; inset: -4%;
        background:
          radial-gradient(60% 50% at 22% 18%, rgba(255,196,120,.16), transparent 65%),
          radial-gradient(55% 45% at 80% 70%, rgba(70,110,170,.14), transparent 70%),
          radial-gradient(90% 70% at 50% 100%, rgba(30,50,85,.35), transparent 75%),
          linear-gradient(180deg, #182338 0%, #0c1526 55%, #080e1b 100%);
        filter: blur(26px) saturate(1.1); }
      /* lens vignette — the frame edges you barely notice while wearing them */
      #frame { position: absolute; inset: 0; pointer-events: none;
        background:
          linear-gradient(180deg, rgba(4,8,16,.85) 0%, transparent 14%),
          radial-gradient(130% 100% at 50% 118%, rgba(4,8,16,.9) 0%, transparent 46%),
          radial-gradient(50% 70% at -4% 50%, rgba(4,8,16,.75) 0%, transparent 60%),
          radial-gradient(50% 70% at 104% 50%, rgba(4,8,16,.75) 0%, transparent 60%);
      }
      /* nose bridge shadow */
      #frame::after { content: ''; position: absolute; left: 46%; bottom: -6%;
        width: 8%; height: 26%; border-radius: 50%;
        background: rgba(4,8,16,.7); filter: blur(30px); }
      #hud {
        position: absolute; left: 56%; top: 24%; width: 30vmin; aspect-ratio: 1;
        mix-blend-mode: screen; filter: saturate(1.3) brightness(1.15)
          drop-shadow(0 0 34px rgba(120,180,255,.18));
      }
      #hud img { width: 100%; height: 100%; opacity: 0; transition: opacity .45s; }
      #hud img.on { opacity: 1; }
      #caption {
        position: absolute; left: 4%; bottom: 5%; z-index: 2;
        font: 500 15px/1.5 system-ui, sans-serif; color: #e8eefb;
        text-shadow: 0 1px 8px rgba(0,0,0,.6); pointer-events: none;
      }
      #caption a { color: #8ec2ff; pointer-events: auto; }
      #root { display: none; }
      body.bare #world, body.bare #frame, body.bare #hud, body.bare #caption { display: none; }
      body.bare #root { display: block; position: fixed; inset: 0; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="world"></div>
      <div id="hud"><img id="hudimg" src="/hud/hud-card.png" alt="digiVoice HUD on the lens" /></div>
      <div id="frame"></div>
      <div id="caption">
        <b>digiVoice HUD</b> — wearer view · real app renders projected on the lens, cycling all 8 states ·
        <a href="?bare=1">open the interactive HUD</a>
      </div>
      <div id="root"></div>
    </div>
    <script>
      const bare = location.search.includes('bare=1');
      if (bare) document.body.classList.add('bare');
      if (!bare) {
        const states = ['card','waiting','sent','frozen','scam','listening','clarify','ambient'];
        const hud = document.getElementById('hudimg'); let i = 0;
        hud.classList.add('on');
        setInterval(() => {
          hud.classList.remove('on');
          setTimeout(() => { i = (i + 1) % states.length;
            hud.src = `/hud/hud-${states[i]}.png`; hud.onload = () => hud.classList.add('on'); }, 350);
        }, 3200);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
