<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="digiVoice HUD — glanceable transaction states for Meta Ray-Ban Display. The lens can propose; only the phone approves." />
    <meta name="mrbd-web-app-capable" content="yes" />
    <link rel="icon" href="data:," />
    <title>digiVoice — Glasses HUD</title>
    <style>
      /* Lens composite — real renders from this app (public/hud/) projected
         onto the right lens of a drawn glasses mock, cycling every state.
         ?bare=1 renders the interactive app instead (test gate / captures). */
      #stage { position: fixed; inset: 0; overflow: hidden;
               background: radial-gradient(120% 90% at 50% 0%, #24344f 0%, #0e1728 60%, #090f1c 100%); }
      #scene { position: absolute; top: 50%; left: 50%; width: 1024px; height: 576px; }
      #glasses { position: absolute; inset: 0; width: 100%; height: 100%; }
      #lens {
        position: absolute; left: 62.5%; top: 35%; width: 19%; aspect-ratio: 1;
        overflow: hidden; border-radius: 18%;
        mix-blend-mode: screen; filter: saturate(1.25) brightness(1.1);
      }
      #lens img { width: 100%; height: 100%; opacity: 0; transition: opacity .45s; }
      #lens img.on { opacity: 1; }
      #caption {
        position: absolute; left: 4%; bottom: 5%; z-index: 2;
        font: 500 15px/1.5 system-ui, sans-serif; color: #e8eefb;
        text-shadow: 0 1px 8px rgba(0,0,0,.6); pointer-events: none;
      }
      #caption a { color: #8ec2ff; pointer-events: auto; }
      body.bare #scene > svg, body.bare #caption, body.bare #lens { display: none; }
      body.bare #scene { position: static; width: 100%; height: 100%; transform: none !important; }
      body.bare #root { display: block; width: 100%; height: 100%; }
      #root { display: none; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="scene">
        <svg id="glasses" viewBox="0 0 1024 576" aria-hidden="true">
          <defs>
            <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#454e61"/><stop offset=".5" stop-color="#232936"/><stop offset="1" stop-color="#161b26"/>
            </linearGradient>
            <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#a8c6e8" stop-opacity=".16"/><stop offset="1" stop-color="#5f80aa" stop-opacity=".06"/>
            </linearGradient>
            <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <!-- temples -->
          <path d="M118 205 C 70 185 25 165 -30 130" fill="none" stroke="url(#frame)" stroke-width="34" stroke-linecap="round"/>
          <path d="M906 205 C 954 185 999 165 1054 130" fill="none" stroke="url(#frame)" stroke-width="34" stroke-linecap="round"/>
          <!-- brow bar -->
          <path d="M122 210 Q 512 158 902 210" fill="none" stroke="url(#frame)" stroke-width="46" stroke-linecap="round"/>
          <!-- lenses -->
          <rect x="140" y="200" width="300" height="215" rx="62" fill="url(#glass)" stroke="url(#frame)" stroke-width="20"/>
          <rect x="584" y="200" width="300" height="215" rx="62" fill="url(#glass)" stroke="url(#frame)" stroke-width="20"/>
          <!-- bridge -->
          <path d="M442 248 Q 512 218 582 248" fill="none" stroke="url(#frame)" stroke-width="22" stroke-linecap="round"/>
          <!-- hinge blocks -->
          <rect x="112" y="196" width="34" height="58" rx="10" fill="url(#frame)"/>
          <rect x="878" y="196" width="34" height="58" rx="10" fill="url(#frame)"/>
          <!-- sheen on left lens -->
          <path d="M170 220 L 300 220 L 210 400 L 165 380 Z" fill="url(#sheen)" opacity=".5"/>
        </svg>
        <div id="lens"><img id="hud" src="/hud/hud-card.png" alt="digiVoice HUD on the lens" /></div>
      </div>
      <div id="caption">
        <b>digiVoice HUD</b> — real app renders projected on the lens, cycling all 8 states ·
        <a href="?bare=1">open the interactive HUD</a>
      </div>
      <div id="root"></div>
    </div>
    <script>
      const bare = location.search.includes('bare=1');
      if (bare) document.body.classList.add('bare');
      const scene = document.getElementById('scene');
      function fit() {
        const s = Math.max(innerWidth / 1024, innerHeight / 576);
        scene.style.transform = `translate(-50%,-50%) scale(${s})`;
      }
      addEventListener('resize', fit); fit();
      if (!bare) {
        const states = ['card','waiting','sent','frozen','scam','listening','clarify','ambient'];
        const hud = document.getElementById('hud'); let i = 0;
        hud.classList.add('on');
        setInterval(() => {
          hud.classList.remove('on');
          setTimeout(() => { i = (i + 1) % states.length;
            hud.src = `/hud/hud-${states[i]}.png`; hud.onload = () => hud.classList.add('on'); }, 350);
        }, 3200);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
