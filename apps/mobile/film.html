<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden;
         background:
           radial-gradient(1200px 600px at 30% -10%, rgba(230,0,35,.14), transparent 60%),
           radial-gradient(1000px 700px at 80% 110%, rgba(37,99,235,.16), transparent 60%),
           linear-gradient(180deg,#182238 0%,#0E1526 60%,#0A0F1C 100%); }
  body::before { content:""; position:fixed; inset:0;
         background-image:radial-gradient(circle, rgba(255,255,255,.045) 1px, transparent 1px);
         background-size:26px 26px; pointer-events:none; }
  body::after { content:""; position:fixed; inset:0; pointer-events:none;
         background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  .stage { display:flex; align-items:center; gap:90px; position:relative; }
  .phone {
    height: 880px; border-radius: 60px; overflow: hidden; flex-shrink:0;
    box-shadow: 0 40px 100px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06),
                0 60px 60px -40px rgba(230,0,35,.12);
  }
  .phone video { display:block; height:100%; }
  .meta { max-width:520px; }
  .state { color:#fff; font:800 44px -apple-system,Helvetica,sans-serif; letter-spacing:-.5px; min-height:54px; }
  .sub { color:#8a8a93; font:500 19px/1.5 -apple-system,Helvetica,sans-serif; margin-top:14px; }
  .rule { margin-top:34px; color:#ffb3a8; font:700 15px/1.5 -apple-system,Helvetica,sans-serif;
          border-left:3px solid #E60023; padding-left:14px; }
</style>
</head>
<body>
<div class="stage">
  <div class="phone"><video id="v" src="../../demo/mobile-run.webm" muted autoplay playsinline></video></div>
  <div class="meta">
    <div class="state" id="st"></div>
    <div class="sub" id="sub"></div>
    <div class="rule">Real iOS Simulator window — the only device that can authorise.</div>
  </div>
</div>
<script>
const CUES = [ // [start seconds into mobile-run.mp4, title, caption]
  [0,    'Happy path',       'Send two hundred to Mum — drafted, verified, signed.'],
  [14,   'Multi-intent',     'Two intents in one utterance — code resolves "half of what\'s left".'],
  [30.5, 'Ambiguous payee',  'Two payees named John — it asks, it never guesses.'],
  [48,   'Validator freeze', 'You said two hundred; the draft showed two thousand. Nothing sent.'],
  [66.5, 'Scam shield',      'Authority + urgency + new account — refused before any draft.'],
];
const v = document.getElementById('v');
const st = document.getElementById('st');
const sub = document.getElementById('sub');
v.addEventListener('timeupdate', () => {
  let cur = CUES[0];
  for (const c of CUES) if (v.currentTime >= c[0]) cur = c;
  if (st.textContent !== cur[1]) { st.textContent = cur[1]; sub.textContent = cur[2]; }
});
v.play().catch(() => {});
</script>
</body>
</html>
