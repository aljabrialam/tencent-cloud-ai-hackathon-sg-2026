<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f33"/>
      <stop offset="1" stop-color="#c22e1b"/>
    </linearGradient>
  </defs>
  <!-- app tile — DBS red (exact #f33 from the official mark) -->
  <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#dg)"/>
  <!-- waveform reading as a "V" — voice, literally shaped -->
  <g fill="#fff">
    <rect x="20"  y="18" width="8" height="52" rx="4"/>
    <rect x="33"  y="28" width="8" height="34" rx="4"/>
    <rect x="46"  y="38" width="8" height="18" rx="4"/>
    <rect x="59"  y="28" width="8" height="34" rx="4"/>
    <rect x="72"  y="18" width="8" height="52" rx="4"/>
  </g>
  <!-- DBS badge: white chip + DBS wordmark in DBS red -->
  <rect x="52" y="64" width="38" height="26" rx="8" fill="#fff"/>
  <text x="71" y="83" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="700" fill="#f33">DBS</text>
</svg>
